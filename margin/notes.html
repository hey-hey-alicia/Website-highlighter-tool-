<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Margin — all notes</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { font-size: 14px; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
    header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 20px; margin: 0; flex: 1; }
    #q { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
      color: var(--fg); font: inherit; margin-bottom: 18px; outline: none; }
    #q:focus { border-color: var(--blue); }
    .stats { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
    .page { margin-bottom: 26px; }
    .page h2 { font-size: 15px; margin: 0 0 2px; }
    .page h2 a { color: var(--fg); text-decoration: none; }
    .page h2 a:hover { text-decoration: underline; }
    .url { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
    .items { display: flex; flex-direction: column; gap: 8px; }
    .quote a { color: inherit; text-decoration: none; }
    .quote a:hover { text-decoration: underline; }
    textarea.note { width: 100%; font: inherit; color: var(--fg); background: transparent; border: 1px dashed transparent;
      border-top-color: var(--line); border-radius: 0; resize: none; overflow: hidden; outline: none; padding: 5px 0 0; }
    textarea.note:focus { border: 1px dashed var(--muted); border-radius: 6px; padding: 5px 6px; }
    textarea.note::placeholder { color: var(--muted); }
    .quote { -webkit-line-clamp: 6; }
    .saved { color: #2f9e44; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>All notes</h1>
      <button class="btn" id="export">Export backup</button>
      <button class="btn" id="import">Import</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </header>
    <input id="q" type="search" placeholder="Search highlights, notes, page titles…" autofocus>
    <div class="stats" id="stats"></div>
    <div id="pages"></div>
  </div>
  <script src="notes.js"></script>
</body>
</html>
